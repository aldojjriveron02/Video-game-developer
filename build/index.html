<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mecha">
<title>Mecha Protocol</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='20' width='48' height='32' rx='6' fill='%232de2e6'/%3E%3Crect x='24' y='8' width='16' height='16' rx='3' fill='%23dfe8ff'/%3E%3Crect x='14' y='52' width='12' height='8' fill='%231a2340'/%3E%3Crect x='38' y='52' width='12' height='8' fill='%231a2340'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1290x2796.png">
<link rel="stylesheet" href="css/style.css">
<!-- Noto Sans JP: needed only for the JA locale (hidden under JAM_BUILD).
     Lazy-loaded after data.js so the jam boot makes zero external requests. -->
</head>
<body>
<div id="app">
  <canvas id="terrain-layer" role="img" aria-label="Battlefield terrain"></canvas>
  <canvas id="unit-layer" role="img" aria-label="Mecha units on the battlefield"></canvas>
  <canvas id="fx-layer" role="img" aria-label="Combat effects and animations"></canvas>
  <div id="hud">
    <div id="turn-banner"></div>
    <div id="hopson-check" class="hidden"></div>
    <div id="save-ind"></div>
    <div id="forecast-panel" class="hidden"></div>
    <div id="controls">
      <button id="btn-fx" class="ctl-btn" style="min-width:52px" title="Reduce effects">✦</button>
      <button id="btn-speed" class="ctl-btn" style="min-width:52px" title="Animation speed">⏩</button>
      <button id="btn-help" class="ctl-btn" style="min-width:52px" title="Help">?</button>
      <button id="btn-lang" class="ctl-btn" style="min-width:52px" title="Language">🌐</button>
      <button id="btn-text" class="ctl-btn" style="min-width:52px" title="Text size">A</button>
      <!-- Round 224 — volume (SunoBoard: judges play in offices/at night) -->
      <button id="btn-mute" class="ctl-btn" style="min-width:52px" title="Mute">🔊</button>
      <input id="vol-slider" type="range" min="0" max="100" value="100" style="width:70px" title="Volume" aria-label="Volume">
      <button id="btn-undo" class="ctl-btn">↩ Undo</button>
      <button id="btn-end" class="ctl-btn primary">End Turn</button>
    </div>
  </div>
  <div id="welcome-screen" class="hidden"></div>
  <div id="coach-mark" class="hidden"></div>
  <div id="hangar-screen" class="hidden"></div>
  <div id="help-screen" class="hidden"></div>
  <div id="briefing-screen" class="hidden"></div>
  <div id="gameover-screen" class="hidden"></div>
</div>
<script src="js/data.js"></script>
<script>
// Noto Sans JP webfont: only fetched when the JA locale can be selected
// (JAM_BUILD hides JA — jam boot stays at zero external requests).
if (typeof JAM_BUILD === 'undefined' || !JAM_BUILD) {
  var _fj = document.createElement('link');
  _fj.rel = 'stylesheet';
  _fj.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap';
  document.head.appendChild(_fj);
}
</script>
<script src="js/mech.js"></script>
<script src="js/grid.js"></script>
<script src="js/ai.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/rng.js"></script>
<script src="js/barks.js"></script>
<script src="js/perf.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-dialogue.js"></script>
<script src="js/save.js"></script>
<!-- GameAnalytics SDK: injected by telemetry.js only when real keys are pasted
     (keys are placeholders until Aldo creates the game — zero CDN at jam boot). -->
<script src="js/telemetry.js"></script>
<script src="js/hangar.js"></script>
<script src="js/game.js"></script>
<script>
// Service worker: cache-first offline play (Round 19). Fails silently — game unaffected.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}
</script>
<!-- Round 221 — aria-live announcements (GoYomi pattern): screen-reader narration of combat state. DOM-layer only. -->
<div id="sr-announce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;"></div>
</body>
</html>
